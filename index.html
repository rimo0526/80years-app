  <style>
    body { margin: 0; padding: 0; background: #ECEAE3; }
    #loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
      color: #2C2C2A; font-size: 14px;
    }
    #loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid #D3D1C7; border-top-color: #378ADD;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>資本主義ゲーム を読み込んでいます…</div>
  </div>
